spring:
  application:
    name: polyvent
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/polyvent}
    username: ${DB_USERNAME:polyvent}
    password: ${DB_PASSWORD:polyvent_local}
  jpa:
    open-in-view: false
    hibernate:
      ddl-auto: validate
  mvc:
    problemdetails:
      enabled: true
server:
  port: ${APP_PORT:8080}
management:
  endpoints:
    web:
      exposure:
        include: health
  endpoint:
    health:
      probes:
        enabled: true
      group:
        readiness:
          include: readinessState,db
      show-details: never
app:
  version: ${APP_VERSION:local}
